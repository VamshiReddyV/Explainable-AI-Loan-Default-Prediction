<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - LoanPredict AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .error-card { background: #fff; border-radius: 16px; padding: 3rem; text-align: center; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #E2E8F0; }
        .error-icon { font-size: 3.5rem; color: #F59E0B; margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; margin: 0 0 1rem 0; }
        p { color: #64748B; font-size: 1rem; line-height: 1.5; margin-bottom: 2rem; }
        .btn-home { display: inline-block; background: #2563EB; color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn-home:hover { background: #1D4ED8; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="fa-solid fa-compass"></i></div>
        <h1>404 - Page Not Found</h1>
        <p>The requested page or applicant assessment record could not be found. Please check the URL or return to home.</p>
        <a href="{{ url_for('landing') }}" class="btn-home">Return to Home</a>
    </div>
</body>
</html>
